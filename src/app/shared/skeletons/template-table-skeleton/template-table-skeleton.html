<div class="table-container">
  <p-table [value]="skeletonArray()" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th scope="col"><p-skeleton /></th>
        <th scope="col"><p-skeleton /></th>
        <th scope="col"><p-skeleton /></th>
        <th scope="col"><p-skeleton /></th>
        <th scope="col"><p-skeleton /></th>
        <th scope="col"><p-skeleton /></th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr>
        <td><p-skeleton /></td>
        <td><p-skeleton /></td>
        <td><p-skeleton /></td>
        <td><p-skeleton /></td>
        <td><p-skeleton /></td>
        <td><p-skeleton /></td>
      </tr>
    </ng-template>
  </p-table>
</div>
