<div class="w-full">
  <p-floatlabel variant="on">
    @if (iconClass()) {
    <p-iconfield>
      <p-inputicon [class]="iconClass()" />
      <input
        pInputText
        [id]="fControlName()"
        [formControlName]="fControlName()"
        [type]="type()"
        class="w-full"
      />
    </p-iconfield>
    } @else {
    <input
      pInputText
      [id]="fControlName()"
      [formControlName]="fControlName()"
      [type]="type()"
      class="w-full"
    />
    }
    <label [for]="fControlName()"> {{ label() | transloco }} </label>
  </p-floatlabel>
</div>
