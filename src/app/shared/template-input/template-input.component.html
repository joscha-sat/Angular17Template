<div class="flex flex-column gap-2 w-full">
  <label [for]="fControlName()" class="font-semibold">
    {{ label() | transloco }}
  </label>
  @if (iconClass()) {
    <p-iconfield>
      <p-inputicon [class]="iconClass()" />
      <input
        pInputText
        [id]="fControlName()"
        [formControlName]="fControlName()"
        [type]="type()"
        class="w-full"
      />
    </p-iconfield>
  } @else {
    <input
      pInputText
      [id]="fControlName()"
      [formControlName]="fControlName()"
      [type]="type()"
      class="w-full"
    />
  }
</div>
