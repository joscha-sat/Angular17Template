<div class="flex flex-column gap-2 w-full">
  <label [for]="fControlName()" class="font-semibold">
    {{ label() | transloco }}
  </label>
  <p-datepicker
    [id]="fControlName()"
    [formControlName]="fControlName()"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    [showIcon]="true"
    dateFormat="dd.mm.yy"
    placeholder="dd.mm.yyyy"
    class="w-full"
  />
</div>
