<div class="table-container">
  <!-- Material table with dynamic columns and data source -->
  <table [dataSource]="tableData()" class="mat-elevation-z8" mat-table>
    <!-- Iterate through each column defined in displayedColumns() -->
    @for (column of displayedColumns(); track column) {
      <ng-container [matColumnDef]="column">
        <!-- Header cell: Shows the column title from headers() array -->
        <th mat-header-cell *matHeaderCellDef>{{ headers()[$index] }}</th>

        <!-- Data cell: Renders for each row in the data source -->
        <!-- If a custom template exists for this column, use it -->
        <!-- otherwise, fall back to the default template -->
        <td mat-cell *matCellDef="let element">
          <ng-container
            *ngTemplateOutlet="
              cellTemplatesMap()[column]
                ? customCellTemplate
                : defaultCellTemplate;
              context: {
                $implicit: extractNestedProperty(element, column),
                element: element,
                column: column,
              }
            "
          />
        </td>
      </ng-container>
    }

    <!-- Renders the fixed header row at the top of the table -->
    <tr *matHeaderRowDef="displayedColumns(); sticky: true" mat-header-row></tr>
    <!-- Renders each data row based on the table's data source -->
    <tr *matRowDef="let row; columns: displayedColumns()" mat-row></tr>
  </table>

  <!-- Pagination control for navigating through table data -->
  <mat-paginator
    (page)="handlePageEvent($event)"
    [length]="totalItemsCount()"
    [pageSizeOptions]="pageSizes()"
    [pageSize]="initialPageSize()"
  />

  <!-- TEMPLATE DEFINITIONS -->

  <!-- Used when a custom cell template is provided for the column -->
  <ng-template
    #customCellTemplate
    let-column="column"
    let-element="element"
    let-value
  >
    <!-- Delegates rendering to the column-specific template from cellTemplatesMap -->
    <ng-container
      *ngTemplateOutlet="
        cellTemplatesMap()[column];
        context: {
          $implicit: value,
          object: element,
        }
      "
    />
  </ng-template>

  <!-- Default template used when no custom template exists for a column -->
  <ng-template #defaultCellTemplate let-value>
    <!-- For date values: format as DD.MM.YYYY HH:MM -->
    @if (value | isDate) {
      {{ value | date: 'dd.MM.yyyy HH:mm' }}
    } @else {
      <!-- For all other values: display as plain text -->
      {{ value }}
    }
  </ng-template>
</div>
