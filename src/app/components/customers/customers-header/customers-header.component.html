<app-header-layout>
  <ng-container left>
    <div class="view-title">
      {{ 'customer.title-plural' | transloco }}
    </div>
  </ng-container>

  <div class="flex-a-center-g1" right>
    <app-template-table-search [service]="customerService" />

    <app-template-date-search [service]="customerService" />

    <p-button (onClick)="openCreateCustomerDialog()" label="{{ 'customer.create' | transloco }}" severity="success" />
  </div>
</app-header-layout>
