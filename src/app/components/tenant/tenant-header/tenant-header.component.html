<app-header-layout>
  <div class="flex-a-center-g1" left>
    <!--  TITLE  -->
    <div class="view-title">
      {{ 'tenant.title' | transloco }}
    </div>

    <!-- TENANT FORM  -->
    <form [formGroup]="form"></form>
  </div>

  <div class="flex-a-center-g1" right>
    <!--  TABLE SEARCH  -->
    <app-template-table-search [service]="tenantService" />

    <!-- NEW TENANT BUTTON -->
    <button (click)="openCreateTenantDialog()" color="secondary" mat-flat-button>
      {{ 'tenant.create' | transloco }}
    </button>
  </div>
</app-header-layout>
