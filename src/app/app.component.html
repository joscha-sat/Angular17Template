@if (isLoggedIn) {
  <app-navigation />
}

<!--  some custom margin, to prevent overlapping with the navigation -->
<div style="margin-left: 4rem">
  <router-outlet />
</div>

<!-- globally used http loading spinner  -->
@if (loadingService.loadingState | async) {
  <div class="global-spinner-overlay">
    <p-progress-spinner [style]="{ width: '50px', height: '50px' }" />
  </div>
}
